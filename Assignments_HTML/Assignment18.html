<html>
    <head>
        <title>
Assignment 18
        </title>
    </head>
    <body>
    <style>
        body {
            font-family: Georgia, serif;
            margin: 0;
            padding: 0;
        }
        header, footer {
            background-color: #1a237e;
            color: white;
            text-align: center;
            padding: 15px 0;
        }
        main {
            max-width: 600px;
            margin: 20px auto;
            padding: 0 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
        }
        th {
            background-color: #e8eaf6;
        }
        th, td {
            border: 1px solid #888;
            padding: 8px;
            text-align: left;
        }
        fieldset {
            padding: 15px;
        }
        input, select, textarea {
            margin-top: 4px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <header>
        <h1>ABC College Admission 2026</h1>
    </header>

    <main>
        <section aria-labelledby="courses-heading">
            <h2 id="courses-heading">Courses and Fees</h2>
            <table>
                <caption>Available Courses</caption>
                <thead>
                    <tr>
                        <th scope="col">Course</th>
                        <th scope="col">Seats</th>
                        <th scope="col">Fees</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>B.Tech CSE</td>
                        <td>120</td>
                        <td>&#8377;90,000</td>
                    </tr>
                    <tr>
                        <td>BCA</td>
                        <td>60</td>
                        <td>&#8377;45,000</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <section aria-label="Student Application">
            <form action="#" method="POST">
                <fieldset>
                    <legend>Application Form</legend>

                    <label for="student-name">Name:</label><br>
                    <input type="text" id="student-name" name="name" size="30" required><br>

                    <label for="student-email">Email:</label><br>
                    <input type="email" id="student-email" name="email" size="30" required><br>

                    <label for="course-select">Course:</label><br>
                    <select id="course-select" name="course" required>
                        <option value="btech">B.Tech CSE</option>
                        <option value="bca">BCA</option>
                    </select><br>

                    <label for="statement">Statement:</label><br>
                    <textarea id="statement" name="statement" rows="4" cols="45" required></textarea><br>

                    <button type="submit">Apply</button>
                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        &copy; 2026 ABC College
    </footer>
 </body>
</html>
